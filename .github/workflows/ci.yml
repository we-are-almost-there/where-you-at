name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 공개 레포에서 워크플로가 레포에 쓰기 권한을 갖지 않게 한다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 끝까지 볼 필요가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # 전체를 받는다. 빌드 전 region-index 검사가 backend/sql의 시드 파일을 읽는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Vercel과 같은 명령. tsc -b와 region-index 검사가 여기 들어 있다.
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    # 빈 DB만 있으면 되는 통합 테스트(FAQ 시드, 시군구 스탬프)를 실제 PostgreSQL에서 돌린다.
    # 운영 DB(Supabase)와 같은 메이저 버전이다. 작업이 끝나면 함께 사라지는 CI 전용 DB라 비밀번호는 고정값이다.
    services:
      postgres:
        image: postgres:17@sha256:0d938e975177bef9f1f61f3f9dbcf2e0aa0a139568f66d3415ed8892eb97f6ac
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      # 운영 DB 접속 정보(DB_*)는 넣지 않는다. 운영 데이터가 필요한 RUN_DB_TESTS 테스트는 계속 건너뛴다.
      # REQUIRE_DB_TESTS=1이면 아래 접속 정보가 빠졌을 때 건너뛰지 않고 실패한다(tests/db_settings.py).
      - run: python -m unittest discover -s tests
        env:
          REQUIRE_DB_TESTS: "1"
          FAQ_TEST_DSN: postgresql://postgres:postgres@localhost:5432/postgres
          SIGUNGU_TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

  # 백엔드 이미지가 빌드되고, 비밀값 없이도 서버가 떠서 /health에 응답하는지 확인한다.
  # DB 접속 정보가 없으므로 /health/ready는 보지 않는다.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: docker build -t where-you-at-api:ci backend
      # 비밀값 파일이 이미지 어디에도 들어가지 않았고, root가 아닌 사용자로 실행되는지 본다.
      # 하위 폴더까지 찾아야 .dockerignore 패턴이 바뀌었을 때 들어온 .env를 잡을 수 있다.
      - run: |
          docker run --rm where-you-at-api:ci sh -c 'test -z "$(find /app -name ".env*")" && test "$(id -u)" != 0'
      - run: docker run -d --name api -p 8000:8000 where-you-at-api:ci
      - run: |
          for _ in $(seq 1 30); do
            # 연결된 뒤 응답이 없을 때도 한 번에 오래 기다리지 않게 요청마다 시간을 제한한다.
            if curl --connect-timeout 1 --max-time 2 -fsS http://localhost:8000/health; then exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
