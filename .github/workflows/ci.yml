name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# 공개 레포에서 워크플로가 레포에 쓰기 권한을 갖지 않게 한다.
permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행은 끝까지 볼 필요가 없다.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # 전체를 받는다. 빌드 전 region-index 검사가 backend/sql의 시드 파일을 읽는다.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Vercel과 같은 명령. tsc -b와 region-index 검사가 여기 들어 있다.
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: faq_test
          POSTGRES_PASSWORD: faq_test
          POSTGRES_DB: faq_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faq_test -d faq_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      FAQ_TEST_DSN: postgresql://faq_test:faq_test@localhost:5432/faq_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Require FAQ PostgreSQL test configuration
        run: |
          if [ -z "$FAQ_TEST_DSN" ]; then
            echo "::error::FAQ_TEST_DSN must be set to run FAQ PostgreSQL integration tests"
            exit 1
          fi
      - run: python -m unittest discover -s tests -v
