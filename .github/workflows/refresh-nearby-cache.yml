name: Refresh expiring nearby caches

on:
  # GitHub 예약 실행은 매시 정각에 몰려 지연·누락이 잦아 정각을 피한다.
  schedule:
    - cron: "17 18 * * *" # 매일 KST 03:17 (UTC 18:17)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: refresh-nearby-cache
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m scripts.refresh_nearby_cache --refresh-expiring 48
        # DB_USER·DB_PASSWORD Secrets는 자전거 수집 역할(06)이라 쓰지 않는다.
        # 캐시 갱신 전용 역할(backend/sql/07_nearby_cache_role.sql)로 접속하고,
        # 호스트·포트·DB 이름(shared transaction pooler 6543)은 공용 Secrets를 쓴다.
        env:
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.NEARBY_DB_USER }}
          DB_PASSWORD: ${{ secrets.NEARBY_DB_PASSWORD }}
